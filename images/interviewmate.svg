<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">InterviewMate project illustration</title>
  <desc id="desc">A conversation panel and practice prompts on a blue and navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10264b"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1010" cy="130" r="210" fill="#fff" opacity=".06"/>
  <rect x="170" y="125" width="860" height="500" rx="28" fill="#fff" opacity=".97"/>
  <rect x="170" y="125" width="860" height="76" rx="28" fill="#f0f5ff"/>
  <circle cx="220" cy="163" r="10" fill="#2563eb"/>
  <text x="250" y="173" fill="#10264b" font-family="Arial, sans-serif" font-size="27" font-weight="700">InterviewMate</text>
  <rect x="225" y="245" width="470" height="92" rx="18" fill="#eaf1ff"/>
  <text x="257" y="284" fill="#233654" font-family="Arial, sans-serif" font-size="22">Tell me about a challenge</text>
  <text x="257" y="315" fill="#233654" font-family="Arial, sans-serif" font-size="22">you solved while learning.</text>
  <rect x="465" y="368" width="505" height="100" rx="18" fill="#2563eb"/>
  <text x="497" y="410" fill="#fff" font-family="Arial, sans-serif" font-size="22">Practise at your own pace</text>
  <text x="497" y="442" fill="#fff" font-family="Arial, sans-serif" font-size="22" opacity=".82">Text and voice practice modes</text>
  <rect x="225" y="520" width="745" height="16" rx="8" fill="#e5eaf2"/>
  <rect x="225" y="520" width="410" height="16" rx="8" fill="#6aa5ff"/>
</svg>
